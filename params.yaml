# Experiment parameters for the California Housing regression pipeline.
# Esha owns this file. Every value the pipeline needs lives here, never in code.

seed: 42

data:
  raw_path: data/raw/california_housing.csv
  cache_dir: data/raw/sklearn_cache
  processed_dir: data/processed
  target: MedHouseVal
  test_size: 0.2
  drop_duplicates: true
  max_rows: null

preprocessing:
  scale: true
  impute_strategy: median

model:
  name: gradient_boosting
  params:
    n_estimators: 100
    max_depth: 12
    min_samples_leaf: 1
    n_jobs: 1

artifacts:
  model_path: models/model.joblib
  metrics_path: metrics.json
