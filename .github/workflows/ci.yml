name: ci

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: pytest
        run: uv run pytest tests/ -q

  data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: schema, ranges and null counts
        run: uv run python scripts/check_data.py

  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - name: train end to end on the committed sample
        run: |
          uv run python -m cooked_ml.cli prepare --params configs/smoke.yaml
          uv run python -m cooked_ml.cli train --params configs/smoke.yaml
          uv run python -m cooked_ml.cli evaluate --params configs/smoke.yaml

  report:
    needs: [lint, test, data-check, smoke-train]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: summary
        run: echo "CI finished for ${{ github.head_ref || github.ref_name }}"
